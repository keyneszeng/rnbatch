name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core only — 引擎不依赖第三方库)
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  static-pages-demo:
    name: Cloudflare Pages Free browser demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build browser-only demo
        working-directory: demo
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: End-to-end test static pages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory demo/dist > /tmp/pages-demo.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep .2
          done
          (cd demo && node tests/blackbox.mjs)
