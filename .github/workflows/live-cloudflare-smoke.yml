name: live-cloudflare-smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 10:17 Asia/Singapore (GitHub Actions scheduled runs may be delayed)
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps and headless Chromium
        working-directory: demo
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify actual https://rnbatch.aibuild.work UI
        working-directory: demo
        env:
          LIVE_BASE: https://rnbatch.aibuild.work
          REQUIRE_ADDITIVE: ${{ github.event_name == 'schedule' && '1' || '0' }}
          REQUIRE_PDF: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: node tests/live-cloudflare.mjs
      - name: Save smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cloudflare-diagnostics
          path: /tmp/rnbatch-live/result.json
          if-no-files-found: ignore
          retention-days: 7
