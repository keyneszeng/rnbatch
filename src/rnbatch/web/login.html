<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>rnbatch · 登录</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#202b3d;background:#f4f6fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:420px;background:white;border:1px solid #dfe3eb;border-radius:18px;padding:32px;box-shadow:0 14px 45px #24344d12}
h1{margin:0;font-size:26px}p{color:#667085;font-size:13px;line-height:1.8;margin:8px 0 24px}
label{display:block;margin:14px 0;font-size:13px;font-weight:600}
input{display:block;margin-top:7px;width:100%;padding:13px;border:1px solid #cbd1dd;border-radius:9px;font:inherit}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#346ae8;color:white;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}#error{color:#be2632;font-size:13px;min-height:25px;margin:10px 0}
small{display:block;color:#98a1ae;margin-top:20px;font-size:12px}
</style></head>
<body><main class="card"><h1>rnbatch</h1>
<p>在线文件命名整理 · 账户登录<br>上传文件、提取关键词、预览确认、下载结果。</p>
<form id="login"><label>用户名<input id="username" autocomplete="username" required maxlength="32"></label>
<label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label>
<div id="error" role="alert" aria-live="polite"></div><button id="submit" type="submit">登录 Web App</button></form>
<small>账号由管理员创建。上传文件仅保留在服务器临时工作区内。</small>
</main><script>
document.getElementById("login").onsubmit=async event=>{
  event.preventDefault();
  const button=document.getElementById("submit"),error=document.getElementById("error");
  button.disabled=true;error.textContent="";
  try{
    const res=await fetch("/auth/login",{method:"POST",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({
        username:document.getElementById("username").value,
        password:document.getElementById("password").value})});
    const data=await res.json();
    if(!res.ok||!data.ok)throw Error(data.error||"登录失败");
    location.assign("/");
  }catch(e){error.textContent=e.message;}
  finally{button.disabled=false;}
};
</script></body></html>
