<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>rnbatch · Web App</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#f4f6fa;color:#202b3d}
*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;
background:white;border-bottom:1px solid #e1e5ef;padding:16px max(20px,calc((100vw - 980px)/2))}
.brand{font-size:21px;font-weight:800}.muted{color:#68768b;font-size:12px}
.wrap{max-width:980px;padding:24px 20px 80px;margin:auto}h1{font-size:24px;margin:0 0 5px}
.card{background:white;border:1px solid #e1e5ec;border-radius:14px;padding:20px;margin:16px 0}
h2{font-size:16px;margin:0 0 15px}.step{font-size:12px;color:#346ae8;font-weight:700;margin-right:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button,.pick{display:inline-block;padding:10px 14px;border:1px solid #cfd6e4;background:white;color:#202b3d;border-radius:9px;
font:inherit;font-size:13px;cursor:pointer}
button.primary,.pick{background:#346ae8;border-color:#346ae8;color:white}
button:disabled{opacity:.45;cursor:not-allowed}.pick input{display:none}
input[type=text],select{border:1px solid #cfd6e4;border-radius:8px;padding:10px;font:inherit;font-size:13px;background:white}
input[type=text]{min-width:220px;flex:1}select{max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{border-radius:22px}.meta{color:#657287;font-size:13px;margin:12px 0;word-break:break-word}
table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}th{color:#748199;font-size:12px}
td,th{padding:9px;border-bottom:1px solid #e9edf2;word-break:break-all}tr.changed td:last-child{color:#265cdb}
tr.conflict{background:#fff2f0;color:#b42d36}.scroll{max-height:360px;overflow:auto}
#status{position:sticky;bottom:10px;background:#f0f4ff;border:1px solid #ccdafb;border-radius:9px;
padding:12px 15px;min-height:45px}.warning{font-size:12px;color:#97650f}
</style></head>
<body><header><div class="brand">rnbatch <span class="muted">Web App</span></div>
<div class="row"><span class="muted">已登录：__USERNAME__</span><button id="logout">退出</button></div></header>
<main class="wrap"><h1>让每份项目文件都有规范的名字</h1>
<p class="muted">浏览器上传副本，提取文档关键词，预览后批量重命名，最后下载 ZIP；你的原始文件不会被直接修改。</p>
<section class="card"><h2><span class="step">01</span>上传文件</h2>
<div class="row"><label class="pick">选择多个文件<input type="file" multiple id="files"></label>
<label class="pick">选择文件夹<input type="file" webkitdirectory multiple id="folder"></label>
<button id="remove" disabled>删除工作区</button></div>
<div class="meta" id="uploads">支持 200 个文件、总量 100 MB、单个 25 MB。工作区闲置 1 小时自动清理。</div>
<div class="warning">不建议上传含敏感个人数据、医疗记录或其他受保护资料。服务管理员需要单独制定存储及删除政策。</div>
</section>
<section class="card"><h2><span class="step">02</span>提取关键词</h2>
<div class="row"><button id="extract" disabled>读取文档候选关键词</button>
<input id="keyword" type="text" placeholder="输入项目名 / 公司名 / 关键词" maxlength="100"></div>
<div class="chips" id="candidates"></div>
<div class="meta" id="source"></div></section>
<section class="card"><h2><span class="step">03</span>设置规则并预览</h2>
<div class="row"><select id="template"><option value="{kw}-{n:02}-{type}">关键词-01-文件类型</option>
<option value="{kw}-{n:02}">关键词-01</option><option value="{kw}-{orig}">关键词-原文件名</option>
<option value="{kw}-{date}-{n:02}">关键词-日期-01</option></select>
<select id="sort"><option value="name">按文件名排序</option><option value="date">按时间排序</option><option value="size">按文件大小排序</option></select>
<button class="primary" id="preview" disabled>预览命名结果</button></div>
<div class="meta" id="summary"></div>
<div class="scroll"><table><thead><tr><th>原文件名</th><th>新文件名</th></tr></thead>
<tbody id="rows"></tbody></table></div></section>
<section class="card"><h2><span class="step">04</span>确认与下载</h2>
<div class="row"><button class="primary" id="apply" disabled>确认执行</button>
<button id="undo" disabled>撤销</button><button class="primary" id="download" disabled>下载 ZIP</button></div>
<div class="meta">下载之前建议核对预览。每次修改均针对当前临时工作区执行。</div></section>
<div id="status" role="status" aria-live="polite">请选择文件开始。</div>
</main><script>
const CSRF="__CSRF__";
const $=id=>document.getElementById(id);
const S={id:"",plan:"",uploaded:false,applied:false};
const notify=text=>{$("status").textContent=text;};
async function api(route,data){
  const res=await fetch(route,{method:"POST",credentials:"same-origin",
    headers:{"Content-Type":"application/json","X-RNBatch-CSRF":CSRF},
    body:JSON.stringify(data||{})});
  const result=await res.json().catch(()=>({ok:false,error:"服务器响应异常"}));
  if(res.status===401){location.assign("/");throw Error("请重新登录");}
  if(!res.ok||!result.ok)throw Error(result.error||"请求失败");
  return result;
}
function clearPlan(){
  S.plan=""; $("apply").disabled=true;$("download").disabled=true;
  $("summary").textContent="";$("rows").replaceChildren();
}
function toggle(on){
  $("extract").disabled=!on;
  $("preview").disabled=!on||!$("keyword").value.trim();
}
async function upload(chosen){
  const files=Array.from(chosen||[]);
  if(!files.length)return;
  if(files.length>200||files.some(f=>f.size>25*1024*1024)||
     files.reduce((n,f)=>n+f.size,0)>100*1024*1024){
    notify("超出上传限制：最多 200 文件，总计 100 MB，单文件 25 MB。");return;
  }
  try{
    toggle(false);clearPlan();$("undo").disabled=true;
    if(S.id){await api("/api/workspaces/delete",{workspace:S.id});S.id="";}
    const created=await api("/api/workspaces/create",{});
    S.id=created.workspace;S.uploaded=false;S.applied=false;
    $("remove").disabled=false;
    for(let i=0;i<files.length;i++){
      const file=files[i];
      const name=file.webkitRelativePath||file.name;
      notify("正在上传 "+(i+1)+"/"+files.length+" · "+name);
      const query=new URLSearchParams({workspace:S.id,name});
      const response=await fetch("/api/workspaces/upload?"+query.toString(),{
        method:"POST",credentials:"same-origin",headers:{"X-RNBatch-CSRF":CSRF},body:file});
      const data=await response.json().catch(()=>({ok:false,error:"服务器响应异常"}));
      if(!response.ok||!data.ok)throw Error(data.error||"上传失败");
    }
    S.uploaded=true;toggle(true);
    $("uploads").textContent=files.length+" 个文件上传完成；原始文件保持不变。";
    notify("上传完成，可以提取关键词或手动填写。");
  }catch(e){notify("上传失败："+e.message);}
}
$("files").onchange=e=>{upload(e.target.files);e.target.value="";};
$("folder").onchange=e=>{upload(e.target.files);e.target.value="";};
$("keyword").oninput=()=>{clearPlan();toggle(S.uploaded&&!S.applied);};
$("sort").onchange=clearPlan;$("template").onchange=clearPlan;
$("extract").onclick=async()=>{
  try{
    notify("正在读取正文…");
    const result=await api("/api/workspaces/extract",{workspace:S.id});
    $("candidates").replaceChildren();
    for(const c of result.candidates){
      const button=document.createElement("button");
      button.textContent=c.kw;button.title=c.why||"";
      button.onclick=()=>{$("keyword").value=c.kw;clearPlan();toggle(true);};
      $("candidates").appendChild(button);
    }
    if(result.candidates.length && !$("keyword").value.trim()){
      $("keyword").value=result.candidates[0].kw;toggle(true);
    }
    $("source").textContent=result.sources.length ?
      "提取示例："+result.sources[0].text.slice(0,240):"未读取到有效正文，请手动输入关键词。";
    notify("提取完成，找到 "+result.candidates.length+" 个候选关键词。");
  }catch(e){notify("提取失败："+e.message);}
};
$("preview").onclick=async()=>{
  try{
    clearPlan();
    const result=await api("/api/workspaces/preview",{
      workspace:S.id,kw:$("keyword").value.trim(),
      template:$("template").value,sort:$("sort").value});
    S.plan=result.plan_token;
    for(const r of result.rows){
      const tr=document.createElement("tr");
      tr.className=r.conflict?"conflict":r.changed?"changed":"";
      for(const value of [r.from,r.to]){
        const td=document.createElement("td");td.textContent=value;tr.appendChild(td);
      }$("rows").appendChild(tr);
    }
    $("summary").textContent=result.count+" 个文件，将修改 "+result.changed+
      " 个，冲突 "+result.conflicts+" 个。";
    $("apply").disabled=result.conflicts>0||result.changed===0;
    notify(result.conflicts?"存在冲突，请更换模板。":"预览完成，确认后可执行。");
  }catch(e){notify("预览失败："+e.message);}
};
$("apply").onclick=async()=>{
  if(!S.plan||!confirm("确认对临时副本执行批量改名？"))return;
  $("apply").disabled=true;
  try{
    const result=await api("/api/workspaces/apply",{workspace:S.id,plan_token:S.plan});
    S.applied=true;S.plan="";$("download").disabled=false;$("undo").disabled=false;
    toggle(false);
    notify("已整理 "+result.renamed+" 个文件，请下载 ZIP。");
  }catch(e){notify("执行失败："+e.message);}
};
$("undo").onclick=async()=>{
  try{
    const result=await api("/api/workspaces/undo",{workspace:S.id});
    $("undo").disabled=result.skipped===0; S.applied=result.skipped>0;
    $("download").disabled=false;clearPlan();
    if(!S.applied)toggle(true);
    notify("恢复 "+result.restored+" 个文件，跳过 "+result.skipped+" 个。");
  }catch(e){notify("撤销失败："+e.message);}
};
$("download").onclick=()=>{
  if(!S.id)return;
  location.assign("/api/workspaces/download?"+
                  new URLSearchParams({workspace:S.id}).toString());
};
$("remove").onclick=async()=>{
  try{
    await api("/api/workspaces/delete",{workspace:S.id});
    S.id="";S.uploaded=false;S.applied=false;clearPlan();
    toggle(false);$("remove").disabled=true;$("undo").disabled=true;
    $("uploads").textContent="已删除临时工作区。";notify("文件已从当前临时工作区删除。");
  }catch(e){notify(e.message);}
};
$("logout").onclick=async()=>{
  try{await api("/auth/logout",{});location.assign("/");}
  catch(e){notify("退出失败："+e.message);}
};
</script></body></html>
